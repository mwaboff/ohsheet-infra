services:
  postgres:
    # Pinned by version + digest so postgres only changes through a reviewed
    # PR (Dependabot proposes patch/digest bumps). apply-infra backs up, pulls
    # the new image and recreates the container on the same data dir.
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    # Room for a clean fast shutdown (checkpoint) when compose recreates or
    # stops postgres, before SIGKILL; compose's default is 10s.
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/ohsheet/postgres:/var/lib/postgresql/data
      - /var/log/ohsheet/postgres:/var/log/postgres
    command: >
      postgres
      -c logging_collector=on
      -c log_directory=/var/log/postgres
      -c log_filename=postgres.log
      -c log_rotation_size=0
      -c log_rotation_age=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  core:
    image: ghcr.io/${GHCR_OWNER}/core:${CORE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - /var/log/ohsheet/core:/app/logs
    mem_limit: 640m
    memswap_limit: 640m
    networks: [internal]

  dawn:
    image: ghcr.io/${GHCR_OWNER}/dawn:${DAWN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/log/ohsheet/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
